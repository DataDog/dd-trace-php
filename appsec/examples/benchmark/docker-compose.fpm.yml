services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    ports:
      - "${HOST_PORT:-8080}:80"
    environment:
      DD_TRACE_AGENT_URL: http://agent:8126
      DD_APPSEC_ENABLED: "true"
      DD_REMOTE_CONFIG_ENABLED: "false"
      DD_APPSEC_TESTING_INVALID_COMMAND: "true"
      DD_APPSEC_HELPER_LOG_FILE: /tmp/ddappsec.log
      DD_APPSEC_HELPER_LOG_LEVEL: ${DD_APPSEC_HELPER_LOG_LEVEL:-info}
      DD_APPSEC_LOG_LEVEL: ${DD_APPSEC_LOG_LEVEL:-warn}
      DD_TRACE_DEBUG: ${DD_TRACE_DEBUG:-false}
      DD_ENV: benchmark
      DD_SERVICE: php-appsec-benchmark
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - SYS_PTRACE
    depends_on:
      - agent

  agent:
    image: datadog/agent:latest
    environment:
      DD_API_KEY: ${DD_API_KEY:-00000000000000000000000000000000}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_REMOTE_CONFIGURATION_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
