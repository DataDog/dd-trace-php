[package]
name = "helper-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "ddappsec_helper"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

serde = { version = "1.0", features = ["derive"] }
serde_tuple = { version = "1.0" }
rmp-serde = "1.1"      # MessagePack support for serde
serde_json = "1.0"
anyhow = { version = "1.0", features = ["backtrace"] }
thiserror = "2"
futures = "0.3"
log = { version = "0.4", features = ["kv", "kv_std"] }  # Logging facade with key-value support
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-stream = "0.1"
libc = "0.2"
arc-swap = "1.7"
crossbeam-epoch = "0.9"  # Epoch-based memory reclamation
libddwaf = { path = "../third_party/libddwaf-rust/crates/libddwaf" }
libddwaf-sys = { path = "../third_party/libddwaf-rust/crates/libddwaf-sys", default-features = false, features = ["ring"] }
datadog-sidecar = { path = "../../libdatadog/datadog-sidecar", default-features = false, features = ["tracing"] }
libdd-common = { path = "../../libdatadog/libdd-common" }
libdd-ipc = { path = "../../libdatadog/libdd-ipc" }
libdd-process-utils = { path = "../../libdatadog/libdd-process-utils" }
libdd-remote-config = { path = "../../libdatadog/libdd-remote-config" }
libdd-telemetry = { path = "../../libdatadog/libdd-telemetry" }
base64 = "0.22.1"
# gzip compression for schemas.
# TODO: do we and libdatadog really need runtime_detection? It only gives
# crc32fast runtime CPU detection. libdatadog's gzip users don't request it,
# but get it through this crate because features unify; dropping it here
# drops it for them too.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend", "runtime_detection"] }

[features]
coverage = []
source-static = ["libddwaf-sys/source-static"]

[build-dependencies]
cc = "1.0"

[dev-dependencies]
serial_test = "3"
