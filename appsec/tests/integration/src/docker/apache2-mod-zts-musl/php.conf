<IfModule mpm_event_module>
    StartServers 1
    ServerLimit 1
    MinSpareThreads 3
    MaxSpareThreads 3
    ThreadsPerChild 3
    MaxRequestWorkers 3
</IfModule>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
    Require all granted
</FilesMatch>

LoadModule php_module /usr/lib/apache2/libphp.so
PHPIniDir /etc/php

DocumentRoot "/var/www/public"
DirectoryIndex index.php index.html

<Directory "/var/www/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

ErrorLog /tmp/logs/apache2/error.log
CustomLog /tmp/logs/apache2/access.log combined
