# cargo-nextest configuration. Only shm_gen_cache's wall-clock wait tests and
# its GenMC suite (shm_gen_cache/verification/README.md) have overrides; other
# tests use the defaults.

[test-groups]
# Each GenMC trial runs GenMC with SGC_GENMC_NTHREADS workers (by default a
# quarter of the cores), so run at most four at a time.
genmc = { max-threads = 4 }

# The wait tests measure wall-clock time against millisecond bounds; tests
# running beside them on the other processors delay them past those bounds
# (on a 4-CPU Windows VM, nearly every run failed one of them). Run them alone.
[[profile.default.overrides]]
filter = 'package(shm_gen_cache) and test(/^wait::timed::tests::/)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(shm_gen_cache_verification) and binary(genmc) and test(/::(safety|witness::)/)'
test-group = 'genmc'
# Trials of the big tests explore for minutes; the runner itself kills GenMC
# after SGC_GENMC_TIMEOUT (default 3600 s), so terminate only well after it.
slow-timeout = { period = "120s", terminate-after = 35 }

# CI (.gitlab/generate-shared.php, "shm_gen_cache tests" and "shm_gen_cache
# tests: windows"): run every test and write a JUnit report to
# target/nextest/ci/junit.xml.
[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
