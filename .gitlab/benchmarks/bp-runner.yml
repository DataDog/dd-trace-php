global_setup:
  - name: Capture hardware/software info
    run: collect_hardware_software_info

experiments:
  - name: microbenchmarks
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
      DD_TRACE_AUTOLOAD_NO_COMPILE: "true"
      # Improve stability of benchmarks
      CFLAGS: "-O2 -falign-functions=64"
      RUN_WEB_BENCHES_WITH_DDPROF: "1"
    # CPU partition on the 48-core runners: 24-25 agent, 26-29 mysql, 30-33 redis,
    # 34-47 benchmark process. The setup and run steps span 26-47.
    setup:
      - name: datadog-agent
        run: datadog_agent
        cpus: 24-25
        config_sh: .gitlab/benchmarks/steps/update-dd-agent-config.sh

      # Configure services once for the paired candidate/baseline run.
      - name: One-time setup
        run: shell
        cpus: 26-47
        script: |
          set -ex

          # The built-in capture step doesn't know about PHP, so capture the PHP version here.
          (which php && php -v > "$ARTIFACTS_DIR/php.txt") || :

          if [ "$BP_SCENARIO" = "tracer" ] || [ "$BP_SCENARIO" = "appsec" ]; then
            echo "extension=ddtrace.so" >> /etc/php/8.2/cgi/conf.d/ddtrace.ini
            taskset -c 26-29 service mysql start
            taskset -c 30-33 redis-server --daemonize yes
          fi

          echo "127.0.0.1 mysql-integration" >> /etc/hosts
          echo "127.0.0.1 redis-integration" >> /etc/hosts

          echo "display_errors=stderr" >> /etc/php/8.2/cli/php.ini
          echo "error_log=/tmp/logs/php-error.log" >> /etc/php/8.2/cli/php.ini
          echo "display_startup_errors=1" >> /etc/php/8.2/cli/php.ini
          echo "display_errors=stderr" >> /etc/php/8.2/cgi/conf.d/php.ini
          echo "error_log=/tmp/logs/php-error-cgi.log" >> /etc/php/8.2/cgi/conf.d/php.ini
          echo "display_startup_errors=1" >> /etc/php/8.2/cgi/conf.d/php.ini

          # Ensure ddprof can run
          if ! sysctl -w kernel.perf_event_paranoid=2; then
            echo -e "\e[41mERROR: Failed to set kernel.perf_event_paranoid to 2. This is required by ddprof.\e[0m"
            echo -e "\e[41mPlease check if the container is running with --privileged.\e[0m"
            exit 1
          fi

    steps:
      - name: Run benchmarks
        run: shell
        cpus: 26-47
        # The generic sequential runner times the candidate before fetching the
        # baseline. Paired BOLT processing needs both builds before either run.
        script: '"$CI_PROJECT_DIR/.gitlab/benchmarks/steps/run-benchmarks.sh"'

      # One analyze step per framework; each step no-ops on the scenarios
      # whose result files its filter doesn't match.
      - name: Analyze PHPBench results
        run: analyze_microbenchmarks
        framework: PHPBench
        input_filter_pattern: $ARTIFACTS_DIR/$BASELINE_OR_CANDIDATE-*-bench-results*.csv
        group_by_pattern: '^(.*)\.csv$'

      - name: Analyze tea results
        run: analyze_microbenchmarks
        framework: GoogleBenchmark
        input_filter_pattern: $ARTIFACTS_DIR/$BASELINE_OR_CANDIDATE-tracer-tea-bench-results.json

      - name: Analyze sirun results
        run: analyze_microbenchmarks
        framework: Sirun
        input_filter_pattern: $ARTIFACTS_DIR/$BASELINE_OR_CANDIDATE-sirun_*.ndjson
        group_by_pattern: '^(.*)\.ndjson$'

    teardown:
      - name: Upload to S3
        run: upload_to_s3
        retries_on_failure: 3
        # If BP_EXTERNAL_S3_URL is empty, bp-runner uses its default S3 destination.
        url: $BP_EXTERNAL_S3_URL
