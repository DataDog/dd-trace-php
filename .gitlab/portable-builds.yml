.portable_build:
  stage: build
  image: "registry.ddbuild.io/ci/dd-trace-php/dd-appsec-php-ci:php-buildonly-rust@sha256:a124ac9419796b60f637648eac9522f06e4257bd756b7844a41867371629d1c0"
  tags: [ "arch:${ARCH}" ]
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cache/cargo"
  before_script:
    - |
      if [ -n "${LIBDATADOG_OVERRIDE_SHA:-}" ]; then
        git config --global --add safe.directory "${CI_PROJECT_DIR}/libdatadog"
        (
          cd libdatadog
          git fetch --depth=1 origin "$LIBDATADOG_OVERRIDE_SHA" 2>/dev/null ||
            git fetch origin "$LIBDATADOG_OVERRIDE_SHA"
          git checkout FETCH_HEAD
        )
      fi
  retry:
    max: 2
    when:
      - unknown_failure
      - data_integrity_failure
      - runner_system_failure
      - scheduler_failure
      - api_failure
      - stuck_or_timeout_failure
      - job_execution_timeout
    exit_codes:
      - 75
      - 128

.portable_profiler:
  extends: .portable_build
  script:
    - .gitlab/build-profiler.sh "datadog-profiling/${ARCHITECTURE}/lib/php/${ABI_NO}" "nts"
    - .gitlab/build-profiler.sh "datadog-profiling/${ARCHITECTURE}/lib/php/${ABI_NO}" "zts"
  variables:
    CARGO_BUILD_JOBS: 12
    KUBERNETES_CPU_REQUEST: 12
    KUBERNETES_MEMORY_REQUEST: 4Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
  cache:
    - key:
        prefix: cargo-cache-${TRIPLET}
        files:
          - Cargo.lock
      paths:
        - "${CARGO_HOME}"
      policy: pull
  artifacts:
    paths:
      - datadog-profiling

.portable_appsec:
  extends: .portable_build
  needs:
    - job: generate-templates
      artifacts: true
    - job: "prepare portable code"
      artifacts: true
  variables:
    MAKE_JOBS: 12
    KUBERNETES_CPU_REQUEST: 12
    KUBERNETES_MEMORY_REQUEST: 4Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
  script: ./.gitlab/build-appsec.sh
  artifacts:
    paths:
      - "appsec_*"

.portable_tracing:
  extends: .portable_build
  variables:
    MAKE_JOBS: 12
    KUBERNETES_CPU_REQUEST: 12
    KUBERNETES_MEMORY_REQUEST: 4Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
  script: ./.gitlab/build-tracing.sh
  artifacts:
    paths:
      - "extensions_*"
      - "standalone_*"

.portable_loader:
  extends: .portable_build
  needs:
    - job: generate-templates
      artifacts: true
    - job: "prepare portable code"
      artifacts: true
  variables:
    MAKE_JOBS: 2
  script: ./.gitlab/build-loader.sh
  artifacts:
    paths:
      - "dd_library_loader-*.so"

.portable_artifact_collection:
  stage: build
  image: registry.ddbuild.io/images/mirror/alpine:3.21
  tags: [ "arch:${ARCH}" ]
  variables:
    GIT_STRATEGY: none
  script:
    - find . -maxdepth 3 -type f -print | sort

"prepare portable code":
  stage: build
  image: registry.ddbuild.io/images/mirror/composer:2
  tags: [ "arch:amd64" ]
  needs:
    - job: generate-templates
      artifacts: true
  script:
    - ./.gitlab/append-build-id.sh
    - composer self-update --no-interaction
    - COMPOSER_MEMORY_LIMIT=-1 composer update --no-interaction
    - make generate
  artifacts:
    paths:
      - VERSION
      - src/bridge/_generated*.php

"cache portable cargo deps: [amd64]":
  extends: .portable_build
  needs:
    - job: generate-templates
      artifacts: true
  variables:
    ARCH: "amd64"
    TRIPLET: "x86_64-unknown-linux-musl"
  script:
    - |
      if [ -e "${CARGO_HOME}/.package-cache" ]; then
        echo "WARNING: .package-cache was part of the cache and should not be"
        rm -vf "${CARGO_HOME}/.package-cache"
      fi
      mkdir -p "${CARGO_HOME}"
      cargo fetch -v --target "${TRIPLET}"
      chmod -R 777 "${CARGO_HOME}"
      rm -vf "${CARGO_HOME}/.package-cache"
  cache:
    - key:
        prefix: cargo-cache-${TRIPLET}
        files:
          - Cargo.lock
      paths:
        - "${CARGO_HOME}"

"compile portable tracing sidecar: [amd64]":
  extends: .portable_build
  needs:
    - job: generate-templates
      artifacts: true
    - job: "prepare portable code"
      artifacts: true
    - job: "cache portable cargo deps: [amd64]"
  variables:
    ARCH: "amd64"
    TRIPLET: "x86_64-unknown-linux-musl"
    CARGO_BUILD_JOBS: 16
    KUBERNETES_CPU_REQUEST: 16
    KUBERNETES_MEMORY_REQUEST: 5Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
  script: ./.gitlab/build-sidecar.sh
  cache:
    - key:
        prefix: cargo-cache-${TRIPLET}
        files:
          - Cargo.lock
      paths:
        - "${CARGO_HOME}"
      policy: pull
  artifacts:
    paths:
      - "libdatadog_php_*.*"
      - "php_sidecar_mockgen_*"

