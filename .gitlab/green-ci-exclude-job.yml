
# Appended to every child pipeline of a libdatadog-latest schedule run (generate-common.php, generate-package.php).
green-ci-exclude:
  stage: .pre
  image: registry.ddbuild.io/images/dd-octo-sts-ci-base:2025.06-1
  tags: [ "arch:amd64" ]
  timeout: 10 minutes
  allow_failure: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: "1"
    GREEN_CI_EXCLUDE_STRICT: "true"
  script:
    - .gitlab/tag-pipeline-green-ci-excluded.sh
