include:
  - project: 'DataDog/benchmarking-platform-tools'
    file: 'images/templates/gitlab/build-ci-images.template.yml'
  - project: 'DataDog/benchmarking-platform-tools'
    file: 'images/templates/gitlab/check-slo-breaches.template.yml'
  - project: 'DataDog/benchmarking-platform-tools'
    file: 'images/templates/gitlab/notify-slo-breaches.template.yml'
  - project: 'DataDog/apm-reliability/apm-sdks-benchmarks'
    file: '.gitlab/ci-php-laravel-realworld-parallel.yml'
  - project: 'DataDog/apm-reliability/apm-sdks-benchmarks'
    file: '.gitlab/ci-php-symfony-realworld-parallel.yml'
  - project: 'DataDog/apm-reliability/apm-sdks-benchmarks'
    file: '.gitlab/ci-php-wordpress-parallel.yml'

# Allows benchmark flakiness monitoring pipelines to run a job.
# See https://github.com/DataDog/benchmarking-platform-tools/tree/main/scripts/stability#stability-monitoring-ci.
.on-master-and-parent-pipeline-source-pipeline-on-success-and-not-interruptible: &on-master-and-parent-pipeline-source-pipeline-on-success-and-not-interruptible
  if: '$CI_PARENT_PIPELINE_SOURCE == "pipeline" && $CI_COMMIT_REF_NAME == "master"'
  when: on_success
  interruptible: false

.on-master-or-nightly-benchmarks-or-release-on-success-and-not-interruptible: &on-master-or-nightly-benchmarks-or-release-on-success-and-not-interruptible
  if: '($CI_COMMIT_REF_NAME == "master" && ($NIGHTLY_BENCHMARKS || $CI_PIPELINE_SOURCE != "schedule")) || $CI_COMMIT_REF_NAME =~ /^ddtrace-/'
  when: on_success
  interruptible: false

# Benchmark jobs run on dedicated bare-metal/same-cpu runners; retry the
# infrastructure-level failures so a flaky runner doesn't fail the pipeline.
.benchmarks-retry: &benchmarks-retry
  max: 2
  when:
    - unknown_failure
    - data_integrity_failure
    - runner_system_failure
    - scheduler_failure
    - api_failure

.macrobenchmarks-rules: &macrobenchmarks-rules
  - <<: *on-master-and-parent-pipeline-source-pipeline-on-success-and-not-interruptible
  - <<: *on-master-or-nightly-benchmarks-or-release-on-success-and-not-interruptible
  - when: manual
    allow_failure: true
    interruptible: true

linux-php-laravel-realworld-parallel:
  retry: *benchmarks-retry
  needs:
    - job: "package extension (bundles): [amd64, x86_64-unknown-linux-gnu]"
      artifacts: true
    - job: datadog-setup.php
      artifacts: true
  rules: *macrobenchmarks-rules
  variables:
    DD_TRACER_ARTIFACT_DIR: "$CI_PROJECT_DIR/packages"

linux-php-symfony-realworld-parallel:
  retry: *benchmarks-retry
  needs:
    - job: "package extension (bundles): [amd64, x86_64-unknown-linux-gnu]"
      artifacts: true
    - job: datadog-setup.php
      artifacts: true
  rules: *macrobenchmarks-rules
  variables:
    DD_TRACER_ARTIFACT_DIR: "$CI_PROJECT_DIR/packages"

linux-php-wordpress-parallel:
  retry: *benchmarks-retry
  needs:
    - job: "package extension (bundles): [amd64, x86_64-unknown-linux-gnu]"
      artifacts: true
    - job: datadog-setup.php
      artifacts: true
  rules: *macrobenchmarks-rules
  variables:
    DD_TRACER_ARTIFACT_DIR: "$CI_PROJECT_DIR/packages"

# The suites' follow-up jobs consume their run job's artifacts through
# `needs`. GitLab starts a job that needs an optional manual job without
# waiting for it, so the follow-up jobs take the run jobs' rules: they run
# where the run jobs run and stay manual elsewhere.
php-laravel-realworld-parallel-generate-slos:
  rules: *macrobenchmarks-rules

php-laravel-realworld-parallel-check-slo-breaches:
  rules: *macrobenchmarks-rules

php-laravel-realworld-parallel-upload-results:
  rules: *macrobenchmarks-rules

php-symfony-realworld-parallel-generate-slos:
  rules: *macrobenchmarks-rules

php-symfony-realworld-parallel-check-slo-breaches:
  rules: *macrobenchmarks-rules

php-symfony-realworld-parallel-upload-results:
  rules: *macrobenchmarks-rules

php-wordpress-parallel-generate-slos:
  rules: *macrobenchmarks-rules

php-wordpress-parallel-check-slo-breaches:
  rules: *macrobenchmarks-rules

php-wordpress-parallel-upload-results:
  rules: *macrobenchmarks-rules

variables:
  # Microbenchmarks CI image, consumed by the benchmark jobs below. Repin to the
  # tag pushed by a `build-benchmark-ci-images` run after changing anything in
  # `.gitlab/benchmarks/container/` (see `.gitlab/benchmarks/README.md`).
  # Built here: https://gitlab.ddbuild.io/DataDog/apm-reliability/dd-trace-php/-/jobs/2300686392
  MICROBENCHMARKS_CI_IMAGE: registry.ddbuild.io/ci/benchmarking-platform:dd-trace-php-156499868
  # The Dockerfile is located at: .gitlab/benchmarks/container/Dockerfile
  BASE_CI_IMAGE_SUFFIX: dd-trace-php-${CI_PIPELINE_ID}
  BASE_CI_IMAGE_CONTAINER_DIR: .gitlab/benchmarks/container
  MACROBENCHMARKS_CI_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/benchmarking-platform:php_laravel-realworld
  # The Dockerfile to this image is located at:
  # https://github.com/DataDog/benchmarking-platform/tree/php/laravel-realworld
  DSM_THROUGHPUT_CI_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/benchmarking-platform:dd-trace-php-dsm
  # The Dockerfile to this image is located at:
  # https://github.com/DataDog/benchmarking-platform/tree/php/data-streams-monitoring

# The template puts this job in the ci-image stage; run it next to the
# benchmarks it builds for instead.
build-benchmark-ci-images:
  stage: benchmarks

# Static llvm-bolt-align tool image, copied into the image above. Its Dockerfile
# is `.gitlab/benchmarks/container/llvm-bolt-align/Dockerfile`; after a rebuild,
# repin the `FROM` of `.gitlab/benchmarks/container/Dockerfile`.
build-llvm-bolt-align-image:
  extends: build-benchmark-ci-images
  needs: []
  timeout: 2h
  variables:
    BASE_CI_IMAGE_SUFFIX: llvm-bolt-align-${CI_PIPELINE_ID}
    BASE_CI_IMAGE: registry.ddbuild.io/ci/benchmarking-platform:$BASE_CI_IMAGE_SUFFIX
    BASE_CI_IMAGE_CONTAINER_DIR: .gitlab/benchmarks/container/llvm-bolt-align

workflow:
  auto_cancel:
    on_new_commit: interruptible

.benchmarks-profiler-rules: &benchmarks-profiler-rules
  - <<: *on-master-and-parent-pipeline-source-pipeline-on-success-and-not-interruptible
  - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_REF_NAME == "master"
    changes:
      paths:
        - profiling/**/*
      compare_to: "master"
    when: on_success
    interruptible: false
  - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_REF_NAME != "master"
    changes:
      paths:
        - profiling/**/*
      compare_to: "master"
    when: on_success
    interruptible: true
  - if: $CI_COMMIT_REF_NAME == "master"
    when: manual
    allow_failure: true
    interruptible: false
  - when: manual
    allow_failure: true
    interruptible: true

.benchmarks-appsec-rules: &benchmarks-appsec-rules
  - <<: *on-master-and-parent-pipeline-source-pipeline-on-success-and-not-interruptible
  - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_REF_NAME == "master"
    changes:
      paths:
        - appsec/src/**/*
      compare_to: "master"
    when: on_success
    interruptible: false
  - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_REF_NAME != "master"
    changes:
      paths:
        - appsec/src/**/*
      compare_to: "master"
    when: on_success
    interruptible: true
  - if: $CI_COMMIT_REF_NAME == "master"
    when: manual
    allow_failure: true
    interruptible: false
  - when: manual
    allow_failure: true
    interruptible: true

.benchmarks-tracer-rules: &benchmarks-tracer-rules
  - <<: *on-master-and-parent-pipeline-source-pipeline-on-success-and-not-interruptible
  - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_REF_NAME == "master"
    when: on_success
    interruptible: false
  - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_REF_NAME != "master"
    when: on_success
    interruptible: true
  - if: $CI_COMMIT_REF_NAME == "master"
    when: manual
    allow_failure: true
    interruptible: false
  - when: manual
    allow_failure: true
    interruptible: true

.pre-release-performance-quality-gates-rules: &pre-release-performance-quality-gates-rules
  - <<: *on-master-or-nightly-benchmarks-or-release-on-success-and-not-interruptible
  - interruptible: true

# notify-slo-breaches must use `when: always` so it fires even when
# check-slo-breaches fails — a failure there means a breach was detected.
.notify-slo-breaches-rules: &notify-slo-breaches-rules
  - if: '($CI_COMMIT_REF_NAME == "master" && ($NIGHTLY_BENCHMARKS || $CI_PIPELINE_SOURCE != "schedule")) || $CI_COMMIT_REF_NAME =~ /^ddtrace-/'
    when: always
    interruptible: false
  - interruptible: true

.microbenchmarks:
  stage: benchmarks
  retry: *benchmarks-retry
  tags: ["runner:apm-k8s-tweaked-metal"]
  needs: []
  image:
    name: $MICROBENCHMARKS_CI_IMAGE
  timeout: 90m
  script:
    # Keep the prelude: the gate and the bp-runner configs both depend on
    # ARTIFACTS_DIR pointing at reports/ and on github.com/DataDog being
    # rewritten to gitlab.ddbuild.io for the benchmark checkouts.
    - export ARTIFACTS_DIR="$(pwd)/reports" && (mkdir "${ARTIFACTS_DIR}" || :)
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/".insteadOf "https://github.com/DataDog/"
    - |
      # Allows benchmark flakiness monitoring pipelines to run this job.
      # See https://github.com/DataDog/benchmarking-platform-tools/tree/main/scripts/stability#stability-monitoring-ci.
      if [ "${CHECK_TRACER_FILE_CHANGES:-false}" = "true" ] && [ "${CI_PARENT_PIPELINE_SOURCE}" != "pipeline" ]; then
        echo "Checking if tracer-related files changed..."
        git fetch origin master:master 2>/dev/null || true
        if ! CHANGED_FILES=$(git diff --name-only HEAD master); then
          echo "Could not diff against master - running benchmarks"
          CHANGED_FILES=benchmark/
        fi
        if ! echo "$CHANGED_FILES" | grep -q -E "^(ext/|tracer/|src/|components/|components-rs/|zend_abstract_interface/|tests/Benchmarks/|benchmark/|tea/|\.gitlab/benchmarks/|\.gitlab/benchmarks\.yml$)"; then
          echo "No tracer-related file changes detected - skipping benchmark execution"
          echo "Reports directory created but empty (no benchmarks needed)" > "${ARTIFACTS_DIR}/skip-reason.txt"
          exit 0
        fi
        echo "Tracer-related file changes detected - proceeding with benchmarks"
      fi
    # Keep submodules at the selected candidate and baseline revisions. The
    # whole flow (agent, one-time setup, paired run, analyze, S3) is driven by
    # the in-repo bp-runner config and PHP step scripts.
    - >-
      GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=submodule.recurse GIT_CONFIG_VALUE_0=true
      BP_SCENARIO=$SCENARIO bp-runner "${CI_PROJECT_DIR}/.gitlab/benchmarks/bp-runner.yml" --debug -t
  artifacts:
    name: "reports"
    when: always
    paths:
      - reports/
    expire_in: 3 months
  variables:
    # Rustup downloads rust-src for the parser's private standard library.
    KUBERNETES_POD_ANNOTATIONS_RUST_NO_PROXY: "beta.fabric.datadoghq.com/no-proxy-additions=static.rust-lang.org"
    UPSTREAM_PROJECT_ID: $CI_PROJECT_ID
    UPSTREAM_PROJECT_NAME: $CI_PROJECT_NAME
    UPSTREAM_BRANCH: $CI_COMMIT_REF_NAME
    UPSTREAM_COMMIT_SHA: $CI_COMMIT_SHA
    DD_SIDECAR_DISABLE_DIRECT_EXEC: 1
    # Empty selects align for comparisons, plain for candidate-only runs.
    # Override with off/plain/align when comparing binary processing modes.
    BOLT_MODE: ""
    # See https://datadoghq.atlassian.net/wiki/spaces/APMINT/pages/7223313012/Flaky+Benchmarks+Monitoring for more details.
    # Analyzer settings. Every bp-runner step inherits the CI process environment,
    # so the settings live here instead of the config.
    SIGNIFICANT_IMPACT_THRESHOLD: "5.0"
    MD_REPORT_ONLY_CHANGES: "1"
    FLAKY_BENCHMARKS_REGEX: ""

benchmarks-profiler:
  extends: .microbenchmarks
  rules: *benchmarks-profiler-rules
  variables:
    SCENARIO: "profiler"

benchmarks-tracer:
  extends: .microbenchmarks
  rules: *benchmarks-tracer-rules
  parallel:
    matrix:
      - TRACER_PART: [ phpbench, phpbench-opcache, tea ]
  artifacts:
    name: "reports"
    when: always
    paths:
      - reports/
    expire_in: 3 months
  variables:
    SCENARIO: "tracer"
    CHECK_TRACER_FILE_CHANGES: "true"

benchmarks-appsec:
  extends: .microbenchmarks
  rules: *benchmarks-appsec-rules
  # reports/ feeds benchmarks-pr-comment (like the other scenarios);
  # the log tarballs are the scenario's own diagnostics.
  artifacts:
    name: "reports"
    when: always
    paths:
      - reports/
      - candidate.tar.gz
      - baseline.tar.gz
    expire_in: 3 months
  variables:
    SCENARIO: "appsec"

# Posts the comparison and uploads results. allow_failure preserves the old || :
# semantics, and a separate job avoids the parallel-teardown race with the S3
# upload.
# One reporting job per scenario: appsec and profiler benchmarks are manual,
# tracer is not, and a need on an unplayed manual job makes GitLab skip the
# dependent.
.benchmarks-report:
  stage: benchmarks-report
  allow_failure: true
  when: on_success
  tags: ["arch:amd64"]
  image: $MICROBENCHMARKS_CI_IMAGE
  timeout: 30m
  script:
    - export ARTIFACTS_DIR="$(pwd)/reports" && (mkdir "${ARTIFACTS_DIR}" || :)
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/".insteadOf "https://github.com/DataDog/"
    - |
      if [ -f "reports/skip-reason.txt" ] && ! ls reports/candidate*.converted.json >/dev/null 2>&1; then
        echo "Benchmarks were skipped (no relevant file changes) - nothing to report"
        exit 0
      elif [ -z "$(ls -A reports/ 2>/dev/null)" ]; then
        echo "ERROR: Reports directory exists but is empty - benchmarks job had issues"
        exit 1
      fi
    - bp-runner "${CI_PROJECT_DIR}/.gitlab/benchmarks/$BP_RUNNER_PR_COMMENT_CONFIG" --debug
  artifacts:
    name: "reports"
    when: always
    paths:
      - reports/
    expire_in: 3 months
  variables:
    # See https://datadoghq.atlassian.net/wiki/spaces/APMINT/pages/7223313012/Flaky+Benchmarks+Monitoring for more details.
    FLAKY_BENCHMARKS_REGEX: ""
    # Analyzer settings the PR comment's comparison output depends on.
    SIGNIFICANT_IMPACT_THRESHOLD: "5.0"
    MD_REPORT_ONLY_CHANGES: "1"

benchmarks-pr-comment:
  extends: .benchmarks-report
  rules: *benchmarks-tracer-rules
  needs: [benchmarks-tracer]
  variables:
    BP_RUNNER_PR_COMMENT_CONFIG: "bp-runner.pr-comment.yml"

benchmarks-pr-comment-appsec:
  extends: .benchmarks-report
  rules:
    - when: on_success
  needs: [benchmarks-appsec]
  variables:
    BP_RUNNER_PR_COMMENT_CONFIG: "bp-runner.pr-comment-appsec.yml"

benchmarks-pr-comment-profiler:
  extends: .benchmarks-report
  rules:
    - when: on_success
  needs: [benchmarks-profiler]
  variables:
    BP_RUNNER_PR_COMMENT_CONFIG: "bp-runner.pr-comment-profiler.yml"

# Kafka and RabbitMQ produce/consume throughput with Data Streams Monitoring
# off and on, against real brokers and agent; fails if DSM adds more than 3%
# duration or memory on top of APM for either broker. Same methodology as the other tracers'
# `<lang>/data-streams-monitoring` suites; see that branch's README.
.benchmarks-dsm-rules: &benchmarks-dsm-rules
  - if: $CI_PIPELINE_SOURCE != "schedule"
    changes:
      paths:
        - src/DDTrace/Integrations/Kafka/**/*
        - src/DDTrace/Integrations/AMQP/**/*
        - tracer/data_streams.*
        - components-rs/data_streams.rs
        - libdatadog
      compare_to: "master"
    when: on_success
    allow_failure: true
    interruptible: true
  - when: manual
    allow_failure: true
    interruptible: true

dsm-throughput:
  stage: benchmarks
  retry: *benchmarks-retry
  needs:
    - job: "package extension (bundles): [amd64, x86_64-unknown-linux-gnu]"
      artifacts: true
    - job: datadog-setup.php
      artifacts: true
  rules: *benchmarks-dsm-rules
  tags: ["runner:apm-k8s-same-cpu"]
  timeout: 1h
  image: $DSM_THROUGHPUT_CI_IMAGE
  script:
    - export ARTIFACTS_DIR="$(pwd)/artifacts" && (mkdir "${ARTIFACTS_DIR}" || :)
    # steps/install-tracer.sh installs the packaged build from ../packages.
    - git clone --branch php/data-streams-monitoring https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/benchmarking-platform platform && cd platform
    - bp-runner bp-runner.yml --debug
  artifacts:
    name: "artifacts"
    when: always
    paths:
      - artifacts/
    expire_in: 3 months

check-big-regressions:
  rules: *benchmarks-tracer-rules
  stage: gate
  needs: [ "benchmarks-tracer" ]
  tags: [ "arch:amd64" ]
  image: registry.ddbuild.io/images/benchmarking-platform-tools-ubuntu@sha256:b682acae509fa391ac559705b66df07cac876e4c46641d2457077972a1c0bbb8
  script: |
    if [ -f "reports/skip-reason.txt" ] && ! ls reports/candidate*.converted.json >/dev/null 2>&1; then
      echo "Benchmarks were skipped (no relevant file changes) - regression check not needed"
      exit 0
    elif [ -z "$(ls -A reports/ 2>/dev/null)" ]; then
      echo "ERROR: Reports directory exists but is empty - benchmarks job had issues"
      exit 1
    else
      echo "Reports directory found with content - running regression check"
      sides=candidate
      # bp-runner writes a bare newline here when the branch has no PR.
      if grep -q '[^[:space:]]' reports/baseline_branch.txt 2>/dev/null; then sides="baseline candidate"; fi
      for result in tracer-bench-results tracer-bench-results-opcache tracer-tea-bench-results; do
        for side in $sides; do
          if [ ! -f "reports/${side}-${result}.converted.json" ]; then
            echo "ERROR: reports/${side}-${result}.converted.json is missing - a benchmarks-tracer shard had issues"
            exit 1
          fi
        done
      done
      export ARTIFACTS_DIR="$(pwd)/reports/"
      bp-runner "${CI_PROJECT_DIR}/.gitlab/benchmarks/bp-runner.fail-on-regression.yml" --debug
    fi
  variables:
    # Gitlab and BP specific env vars. Do not modify.
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: dd-trace-php

.macrobenchmarks:
  stage: benchmarks
  retry: *benchmarks-retry
  needs:
    - job: "package extension (bundles): [amd64, x86_64-unknown-linux-gnu]"
      artifacts: true
    - job: datadog-setup.php
      artifacts: true
  rules: *macrobenchmarks-rules
  tags: ["runner:apm-k8s-same-cpu"]
  timeout: 1h
  image: $MACROBENCHMARKS_CI_IMAGE
  script:
    - git clone --branch php/laravel-realworld https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/benchmarking-platform platform && cd platform
    - ./steps/run-benchmarks.sh
  artifacts:
    name: "artifacts"
    when: always
    paths:
      - platform/artifacts/
    expire_in: 3 months
  variables:
    K6_OPTIONS_WARMUP_RATE: 70
    K6_OPTIONS_WARMUP_DURATION: 1m
    K6_OPTIONS_WARMUP_GRACEFUL_STOP: 10s
    K6_OPTIONS_WARMUP_PRE_ALLOCATED_VUS: 4
    K6_OPTIONS_WARMUP_MAX_VUS: 4
    K6_OPTIONS_NORMAL_OPERATION_RATE: 50
    K6_OPTIONS_NORMAL_OPERATION_DURATION: 5m
    K6_OPTIONS_NORMAL_OPERATION_GRACEFUL_STOP: 10s
    K6_OPTIONS_NORMAL_OPERATION_PRE_ALLOCATED_VUS: 4
    K6_OPTIONS_NORMAL_OPERATION_MAX_VUS: 4
    K6_OPTIONS_HIGH_LOAD_RATE: 200
    K6_OPTIONS_HIGH_LOAD_DURATION: 2m
    K6_OPTIONS_HIGH_LOAD_GRACEFUL_STOP: 10s
    K6_OPTIONS_HIGH_LOAD_PRE_ALLOCATED_VUS: 4
    K6_OPTIONS_HIGH_LOAD_MAX_VUS: 4
    # See https://datadoghq.atlassian.net/wiki/spaces/APMINT/pages/7223313012/Flaky+Benchmarks+Monitoring for more details.
    FLAKY_BENCHMARKS_REGEX: ""
  allow_failure: true

macrobenchmarks:
  extends: .macrobenchmarks
  parallel:
    matrix:
      - PHP_VERSION: "7.4"
      - PHP_VERSION: "8.1"

check-slo-breaches:
  extends: .check-slo-breaches
  stage: gate
  needs: ["macrobenchmarks"]
  rules: *pre-release-performance-quality-gates-rules
  artifacts:
    name: "artifacts"
    when: always
    paths:
      - platform/artifacts/
    expire_in: 3 months
  variables:
    DDOCTOSTS_POLICY: "gitlab-ci-slo-change-tracking"
    ARTIFACTS_DIR: "platform/artifacts"
    SLO_FILE: ".gitlab/bp-runner.fail-on-breach.yml"

notify-slo-breaches:
  extends: .notify-slo-breaches
  stage: notify
  needs: ["check-slo-breaches"]
  rules: *notify-slo-breaches-rules
  variables:
    CHANNEL: "guild-dd-php"
