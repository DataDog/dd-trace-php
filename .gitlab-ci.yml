stages:
- test
default:
  retry:
    max: 2
    when:
    - unknown_failure
    - data_integrity_failure
    - runner_system_failure
    - scheduler_failure
    - api_failure
    - stuck_or_timeout_failure
    - job_execution_timeout
    exit_codes:
    - 75
    - 128
variables:
  FF_ENABLE_BASH_EXIT_CODE_CHECK: 'true'
  FF_USE_NEW_BASH_EVAL_STRATEGY: 'true'
  GIT_SUBMODULE_STRATEGY: none
Inspect restored Cargo cache:
  stage: test
  image: registry.ddbuild.io/images/mirror/alpine:3.20
  tags:
  - arch:amd64
  variables:
    KUBERNETES_CPU_REQUEST: 1
    KUBERNETES_CPU_LIMIT: 1
    KUBERNETES_MEMORY_REQUEST: 256Mi
    KUBERNETES_MEMORY_LIMIT: 256Mi
    KUBERNETES_HELPER_CPU_REQUEST: 1
    KUBERNETES_HELPER_CPU_LIMIT: 1
    KUBERNETES_HELPER_MEMORY_REQUEST: 2Gi
    KUBERNETES_HELPER_MEMORY_LIMIT: 2Gi
  cache:
    policy: pull
    key:
      prefix: ${CACHE_PREFIX}
      files:
      - Cargo.lock
      - rust-toolchain.toml
    paths:
    - .cache/profiler-target/
    - tmp/build_profiler/target-common/
    - tmp/build_combined/target-common/
    - .cache/prof-correctness-cargo/registry/index/
    - .cache/prof-correctness-cargo/registry/cache/
  parallel:
    matrix:
    - CACHE_PREFIX:
      - prof16656-phpt-trimmed-v3-amd64-php-8.6_centos-7-3-1
      CACHE_PATH:
      - .cache/profiler-target
    - CACHE_PREFIX:
      - prof16656-phpt-trimmed-v3-amd64-php-compile-extension-alpine-8.6-1
      CACHE_PATH:
      - .cache/profiler-target
    - CACHE_PREFIX:
      - prof16656-phpt-trimmed-v3-arm64-php-compile-extension-alpine-8.6-1
      CACHE_PATH:
      - .cache/profiler-target
    - CACHE_PREFIX:
      - prof16656-correctness-trimmed-v2-8.5-nts-1
      CACHE_PATH:
      - tmp/build_combined/target-common
    - CACHE_PREFIX:
      - prof16656-correctness-trimmed-v2-8.6-nts-1
      CACHE_PATH:
      - tmp/build_profiler/target-common
  script:
  - du -sk "${CACHE_PATH}"
  - find "${CACHE_PATH}" -type f | wc -l
  - test -z "$(find "${CACHE_PATH}" -type f -name 'libdatadog_php.*' -print)"
Explain warm Cargo rebuilds:
  stage: test
  tags:
  - arch:amd64
  image: registry.ddbuild.io/ci/dd-trace-php/dd-trace-ci:php-${PHP_MAJOR_MINOR}_bookworm-14
  retry: 1
  variables:
    KUBERNETES_CPU_REQUEST: 5
    KUBERNETES_CPU_LIMIT: 5
    KUBERNETES_MEMORY_REQUEST: 6Gi
    KUBERNETES_MEMORY_LIMIT: 6Gi
    KUBERNETES_HELPER_CPU_REQUEST: 1
    KUBERNETES_HELPER_CPU_LIMIT: 1
    KUBERNETES_HELPER_MEMORY_REQUEST: 2Gi
    KUBERNETES_HELPER_MEMORY_LIMIT: 2Gi
    PROFILER_SO: ${CI_PROJECT_DIR}/tmp/build_profiler/modules/datadog-profiling.so
    DD_PROFILING_ENABLED: 'true'
    DD_TRACE_ENABLED: 'false'
    DD_INSTRUMENTATION_TELEMETRY_ENABLED: 'false'
    DD_REMOTE_CONFIG_ENABLED: 'false'
    PROFILER_LOG: ${CI_PROJECT_DIR}/artifacts/prof-correctness/profiler.log
    PROF_ANALYZE: ${CI_PROJECT_DIR}/tmp/prof-analyze
    CARGO_HOME: ${CI_PROJECT_DIR}/.cache/prof-correctness-cargo
    CACHE_COMPRESSION_FORMAT: tarzstd
    CACHE_COMPRESSION_LEVEL: fastest
    PHP_MAJOR_MINOR: '8.5'
    FLAVOUR: nts
    RUN: '1'
    CARGO_LOG: cargo::core::compiler::fingerprint=info
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_PATHS: libdatadog appsec/third_party/libddwaf-rust
  cache:
    key:
      prefix: prof16656-correctness-trimmed-v2-8.5-nts-1
      files:
      - Cargo.lock
      - rust-toolchain.toml
    paths:
    - .cache/prof-correctness-cargo/registry/index/
    - .cache/prof-correctness-cargo/registry/cache/
    - tmp/build_profiler/target-common/
    - tmp/build_combined/target-common/
    policy: pull
  before_script:
  - unset DD_SERVICE
  - unset DD_ENV
  - unset DD_TAGS
  - unset DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
  - unset DD_ENTITY_ID
  script:
  - switch-php "${FLAVOUR}"
  - php -r 'exit((int) ((bool) PHP_ZTS !== (getenv("FLAVOUR") === "zts")));' || { echo "ERROR expected ${FLAVOUR} PHP"; exit
    1; }
  - "if [ \"${FLAVOUR}\" = \"zts\" ]; then\n  # The CI image ships parallel for ZTS builds (see\n  # dockerfiles/ci/bookworm/build-extensions.sh).\n\
    \  php -r 'exit(extension_loaded(\"parallel\") ? 0 : 1);' || { echo \"ERROR parallel not loaded\"; exit 1; }\nfi\n"
  - mkdir -p "$(dirname "${PROFILER_LOG}")"
  - ': > "${PROFILER_LOG}"'
  - "if [ \"${PHP_MAJOR_MINOR}\" = \"8.5\" ]; then\n  # Exercise the shipped self-contained tracer+profiler product.\n  export\
    \ PROFILER_SO=\"${CI_PROJECT_DIR}/tmp/build_combined/modules/ddtrace.so\"\n  profiler_ri=ddtrace\n  make compile_combined\n\
    else\n  profiler_ri=datadog-profiling\n  make compile_profiler PROFILER_FEATURES=trigger_time_sample\nfi\n"
  - php -v
  - php -d extension="${PROFILER_SO}" --ri "${profiler_ri}"
  after_script:
  - du -sk tmp/build_combined/target-common
