stages:
- test
variables:
  FF_ENABLE_BASH_EXIT_CODE_CHECK: 'true'
  FF_USE_NEW_BASH_EVAL_STRATEGY: 'true'
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_PATHS: libdatadog tests/FeatureFlags/ffe-system-test-data appsec/third_party/libddwaf-rust
  GITHUB_RELEASES_MIRROR: https://depot-read-api-github-releases.us1.ddbuild.io/internal/mirror/github-releases
default:
  retry:
    max: 2
    when:
    - unknown_failure
    - data_integrity_failure
    - runner_system_failure
    - scheduler_failure
    - api_failure
    - stuck_or_timeout_failure
    - job_execution_timeout
    exit_codes:
    - 75
    - 128
profiling tests:
  stage: test
  tags:
  - arch:${ARCH}
  image: registry.ddbuild.io/ci/dd-trace-php/dd-trace-ci:${IMAGE_PREFIX}${PHP_MAJOR_MINOR}${IMAGE_SUFFIX}
  interruptible: true
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    interruptible: false
  - when: on_success
  variables:
    KUBERNETES_CPU_REQUEST: ${CPUS}
    KUBERNETES_CPU_LIMIT: ${CPUS}
    KUBERNETES_MEMORY_REQUEST: 6Gi
    KUBERNETES_MEMORY_LIMIT: 6Gi
    KUBERNETES_HELPER_CPU_REQUEST: 1
    KUBERNETES_HELPER_CPU_LIMIT: 1
    KUBERNETES_HELPER_MEMORY_REQUEST: 2Gi
    KUBERNETES_HELPER_MEMORY_LIMIT: 2Gi
    CARGO_TARGET_DIR: /mnt/ramdisk/cargo
  parallel:
    matrix:
    - PHP_MAJOR_MINOR:
      - '8.6'
      ARCH:
      - amd64
      IMAGE_PREFIX:
      - php-
      IMAGE_SUFFIX:
      - _centos-7-3
      CPUS:
      - '3'
      - '4'
      - '5'
      - '6'
      RUN:
      - '1'
      - '2'
      - '3'
    - PHP_MAJOR_MINOR:
      - '8.6'
      ARCH:
      - amd64
      IMAGE_PREFIX:
      - php-compile-extension-alpine-
      IMAGE_SUFFIX:
      - ''
      CPUS:
      - '3'
      - '4'
      - '5'
      - '6'
      RUN:
      - '1'
      - '2'
      - '3'
    - PHP_MAJOR_MINOR:
      - '8.6'
      ARCH:
      - arm64
      IMAGE_PREFIX:
      - php-compile-extension-alpine-
      IMAGE_SUFFIX:
      - ''
      CPUS:
      - '3'
      - '4'
      - '5'
      - '6'
      RUN:
      - '1'
      - '2'
      - '3'
  script:
  - if [ -d '/opt/rh/devtoolset-7' ]; then set +eo pipefail; source scl_source enable devtoolset-7; set -eo pipefail; fi
  - if [ -d '/opt/rh/devtoolset-7' ] && [ "$(uname -m)" = "aarch64" ]; then export BINDGEN_EXTRA_CLANG_ARGS="-I$(clang --print-resource-dir)/include";
    fi
  - if [ -f /sbin/apk ] && [ $(uname -m) = "aarch64" ]; then ln -sf ../lib/llvm17/bin/clang /usr/bin/clang; fi
  - export DD_PROFILING_OUTPUT_PPROF=/tmp/
  - cd profiling
  - 'echo "nproc: $(nproc)"'
  - 'echo "KUBERNETES_CPU_REQUEST: ${KUBERNETES_CPU_REQUEST:-<unset>}"'
  - run_tests_php=$(find $(php-config --prefix) -name run-tests.php)
  - cp -v "${run_tests_php}" tests
  - '# run-tests.php is parallel by default since PHP 8.6; keep these tests serial (-j exists since 7.4)'
  - run_tests_jobs=$(php -n -r 'echo PHP_VERSION_ID >= 70400 ? "-j1":"";')
  - unset DD_SERVICE; unset DD_ENV
  - mkdir -p "${CI_PROJECT_DIR}/artifacts/profiler-tests"
  - shopt -s expand_aliases
  - '# NTS combined (tracer + profiling in one ddtrace.so, as shipped)'
  - switch-php "${PHP_MAJOR_MINOR}"
  - php -r 'exit((int) PHP_ZTS);' || { echo 'ERROR expected NTS PHP'; exit 1; }
  - (cd ..; phpize && DDTRACE_PROFILING_FEATURES="debug_stats,test,tracing,tracing-subscriber,trigger_time_sample" ./configure
    --enable-ddtrace-tracer --enable-ddtrace-profiling && make -j$(nproc))
  - test -f "${CI_PROJECT_DIR}/modules/ddtrace.so" || { echo "ERROR combined build did not produce modules/ddtrace.so"; find
    "${CI_PROJECT_DIR}/modules" -maxdepth 1 -type f -print; exit 1; }
  - php -d "extension=${CI_PROJECT_DIR}/modules/ddtrace.so" -r 'if (!extension_loaded("ddtrace") || ini_get("datadog.profiling.enabled")
    === false) { exit(1); }'
  - (cd ../; TEST_PHP_JUNIT="${CI_PROJECT_DIR}/artifacts/profiler-tests/nts-combined-results.xml" php profiling/tests/run-tests.php
    -P ${run_tests_jobs} -d "extension=${CI_PROJECT_DIR}/modules/ddtrace.so" --show-diff -g "FAIL,XFAIL,BORK,WARN,LEAK,XLEAK,SKIP"
    "profiling/tests/phpt")
  - '# ZTS combined (tracer + profiling in one ddtrace.so, as shipped)'
  - switch-php "${PHP_MAJOR_MINOR}-zts"
  - php -r 'exit((int) !PHP_ZTS);' || { echo 'ERROR expected ZTS PHP'; exit 1; }
  - touch ../profiling/build.rs
  - (cd ..; make distclean || true; phpize && DDTRACE_PROFILING_FEATURES="debug_stats,test,tracing,tracing-subscriber,trigger_time_sample"
    ./configure --enable-ddtrace-tracer --enable-ddtrace-profiling && make -j$(nproc))
  - test -f "${CI_PROJECT_DIR}/modules/ddtrace.so" || { echo "ERROR combined ZTS build did not produce modules/ddtrace.so";
    find "${CI_PROJECT_DIR}/modules" -maxdepth 1 -type f -print; exit 1; }
  - php -d "extension=${CI_PROJECT_DIR}/modules/ddtrace.so" -r 'if (!extension_loaded("ddtrace") || ini_get("datadog.profiling.enabled")
    === false) { exit(1); }'
  - (cd ../; TEST_PHP_JUNIT="${CI_PROJECT_DIR}/artifacts/profiler-tests/zts-combined-results.xml" php profiling/tests/run-tests.php
    -P ${run_tests_jobs} -d "extension=${CI_PROJECT_DIR}/modules/ddtrace.so" --show-diff -g "FAIL,XFAIL,BORK,WARN,LEAK,XLEAK,SKIP"
    "profiling/tests/phpt")
  after_script:
  - "if [ \"${IMAGE_SUFFIX}\" != \"_centos-7-3\" ]; then\n  .gitlab/silent-upload-junit-to-datadog.sh \"test.source.file:profiling/\"\
    \nelse\n  echo \"Skipping JUnit upload on CentOS 7 (old glibc/OpenSSL incompatible with datadog-ci)\"\nfi\n"
  artifacts:
    reports:
      junit: artifacts/profiler-tests/*.xml
    paths:
    - artifacts/
    when: always
