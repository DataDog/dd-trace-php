# Generates shm_gen_cache.h (committed). Regenerate from the repository root:
#   cbindgen --crate shm_gen_cache --config shm_gen_cache/cbindgen.toml \
#     --output shm_gen_cache/shm_gen_cache.h
# (also part of `make generate_cbindgen`).

language = "C"
cpp_compat = true
tab_width = 2
include_guard = "DDOG_SHM_GEN_CACHE_H"
pragma_once = true
style = "both"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
usize_is_size_t = true
header = """// Unless explicitly stated otherwise all files in this repository are licensed under the Apache License Version 2.0.
// This product includes software developed at Datadog (https://www.datadoghq.com/). Copyright 2026-Present Datadog, Inc.

// Mutex-free, process-shared, two-generation byte cache (see shm_gen_cache/README.md).
// Generated by cbindgen from shm_gen_cache/src/ffi.rs; do not edit."""

[export]
prefix = "ddog_sgc_"
# Only the C API (src/ffi.rs) and its types; constants and the remaining pub
# Rust items are not part of it.
item_types = ["enums", "structs", "opaque", "functions"]
exclude = ["RotationOwner", "__VERIFIER_assert_fail"]

[export.rename]
"FfiCache" = "Cache"
"FfiParticipant" = "Participant"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
