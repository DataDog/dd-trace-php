version: '3.7'

services:

  base-alpine:
    image: ${CI_REGISTRY_IMAGE:-datadog/dd-trace-ci}:php-compile-extension-alpine
    build:
      context: .
      dockerfile: base.Dockerfile
      x-bake: &bake
        platforms:
          - linux/arm64
          - linux/amd64
      args: &build-base
        # Build php images FROM the (possibly freshly built) internal base,
        # not the Docker Hub fallback baked into the Dockerfile ARG default.
        CI_REGISTRY_IMAGE: ${CI_REGISTRY_IMAGE:-datadog/dd-trace-ci}
    volumes:
        - ../../:/app

  7.0-alpine:
    image: ${CI_REGISTRY_IMAGE:-datadog/dd-trace-ci}:php-compile-extension-alpine-7.0
    build:
      context: .
      x-bake: *bake
      args:
        <<: *build-base
        phpVersion: 7.0.33
        phpSha256Hash: d71a6ecb6b13dc53fed7532a7f8f949c4044806f067502f8fb6f9facbb40452a
        phpApi: 20151012
    volumes:
        - ../../:/app

