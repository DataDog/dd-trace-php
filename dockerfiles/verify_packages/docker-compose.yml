version: '3.2'

services:
  alpine:
    image: ${ALPINE_IMAGE}
    working_dir: /datadog
    volumes:
      - ../../:/datadog
    environment:
      PHP_PACKAGE: ${PHP_PACKAGE}
      PACKAGE_TYPE: ${PACKAGE_TYPE}
      DD_AGENT_HOST: request-replayer
      DD_TRACE_AGENT_PORT: 80
      DD_TRACE_DEBUG: 'false'
      DD_TRACE_AGENT_FLUSH_INTERVAL: 1000
    depends_on:
      - request-replayer

  centos:
    image: ${DOCKER_IMAGE}
    working_dir: /datadog
    volumes:
      - ../../:/datadog
    environment:
      DD_AGENT_HOST: request-replayer
      DD_TRACE_AGENT_PORT: 80
      DD_TRACE_DEBUG: 'false'
      DD_TRACE_AGENT_FLUSH_INTERVAL: 1000
    depends_on:
      - request-replayer

  debian:
    image: ${DOCKER_IMAGE}
    working_dir: /datadog
    volumes:
      - ../../:/datadog
    environment:
      DD_AGENT_HOST: request-replayer
      DD_TRACE_AGENT_PORT: 80
      DD_TRACE_DEBUG: 'false'
      DD_TRACE_AGENT_FLUSH_INTERVAL: 1000
    depends_on:
      - request-replayer

  tar_gz:
    image: debian:buster
    working_dir: /datadog
    volumes:
      - ../../:/datadog

  request-replayer:
    image: datadog/dd-trace-ci:php-request-replayer
