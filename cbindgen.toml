language = "C"
tab_width = 2
include_guard = "DDTRACE_PHP_H"
style = "both"
header = """
struct _zend_string;
typedef struct _zend_string _zend_string;
"""

no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
includes = ["common.h", "telemetry.h", "sidecar.h"]

after_includes = """

#define ddog_DYANMIC_CONFIG_UPDATE_UNMODIFIED (_zend_string*)1

/* These are [u8; 36] statics in Rust, with alignment 1. Without saying so,
 * Clang applies the x86-64 psABI rule that arrays of 16 bytes or more are
 * 16-byte aligned, and copies them with movaps, which faults. */
#ifndef _MSC_VER
extern _Alignas(1) uint8_t datadog_formatted_session_id[36];
extern _Alignas(1) uint8_t datadog_formatted_root_session_id[36];
extern _Alignas(1) uint8_t datadog_formatted_parent_session_id[36];
#else
/* MSVC has no _Alignas without /std:c11, and makes no such assumption. */
extern uint8_t datadog_formatted_session_id[36];
extern uint8_t datadog_formatted_root_session_id[36];
extern uint8_t datadog_formatted_parent_session_id[36];
#endif"""

[defines]
"feature = profiling" = "DDTRACE_PROFILING"
"target_os = linux" = "__linux__"

[export]
prefix = "ddog_"
renaming_overrides_prefixing = true
exclude = [
    "get_module", "posix_spawn_file_actions_addchdir_np",
    "ddog_appsec_body_private_json", "ddog_appsec_body_private_xml",
    "ddog_appsec_body_private_drop",
]

[export.mangle]
rename_types = "PascalCase"

[export.rename]
"ParseTagsResult" = "ddog_Vec_Tag_ParseResult"
"PushTagResult" = "ddog_Vec_Tag_PushResult"
"ZendString" = "_zend_string"
"FILE" = "FILE"
"EndpointConfig" = "ddog_crasht_EndpointConfig"
"Metadata" = "ddog_crasht_Metadata"
"MaybeOwnedZendString" = "_zend_string *"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = true
include = [
    "libdd-common",
    "libdd-networking",
    "libdd-telemetry",
    "libdd-telemetry-ffi",
    "libdd-common-ffi",
    "datadog-crashtracker-ffi",
    "datadog-sidecar",
    "libdd-ipc",
    "libdd-live-debugger",
    "libdd-live-debugger-ffi",
    "libdd-remote-config",
    "uuid"
]
