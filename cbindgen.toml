language = "C"
tab_width = 2
include_guard = "DDTRACE_PHP_H"
style = "both"
header = """
struct _zend_string;
typedef struct _zend_string _zend_string;
"""
# The Rust definitions use aligned wrappers that cbindgen must not expose.
# Preserve the existing C array declarations; see
# https://github.com/mozilla/cbindgen/issues/1185.
after_includes = """
extern uint8_t datadog_formatted_session_id[36];
extern uint8_t datadog_formatted_root_session_id[36];
extern uint8_t datadog_formatted_parent_session_id[36];
"""

no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
includes = ["common.h", "telemetry.h", "sidecar.h"]

after_includes = "#define ddog_DYANMIC_CONFIG_UPDATE_UNMODIFIED (_zend_string*)1"

[defines]
"feature = profiling" = "DDTRACE_PROFILING"
"target_os = linux" = "__linux__"

[export]
prefix = "ddog_"
renaming_overrides_prefixing = true
exclude = ["get_module", "posix_spawn_file_actions_addchdir_np"]

[export.mangle]
rename_types = "PascalCase"

[export.rename]
"ParseTagsResult" = "ddog_Vec_Tag_ParseResult"
"PushTagResult" = "ddog_Vec_Tag_PushResult"
"ZendString" = "_zend_string"
"FILE" = "FILE"
"EndpointConfig" = "ddog_crasht_EndpointConfig"
"Metadata" = "ddog_crasht_Metadata"
"MaybeOwnedZendString" = "_zend_string *"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = true
include = [
    "libdd-common",
    "libdd-telemetry",
    "libdd-telemetry-ffi",
    "libdd-common-ffi",
    "datadog-crashtracker-ffi",
    "datadog-sidecar",
    "libdd-ipc",
    "libdd-live-debugger",
    "libdd-live-debugger-ffi",
    "libdd-remote-config",
    "uuid"
]
