[package]
name = "ddtrace-appsec-body"
version = "0.0.1"
edition = "2021"
rust-version = "1.91.1"
license = "Apache-2.0"
# tests/isolation_test.rs is compiled with rustc and must not be linked as an rlib.
autotests = false

# A separate build is essential: dependencies and std must use the parser's
# allocator and unwind runtime, even when the tracer uses panic=abort.
[workspace]

[lib]
path = "lib.rs"
crate-type = ["staticlib"]

[dependencies]
serde = "=1.0.228"
serde_json = "=1.0.150"
quick-xml = { version = "=0.37.5", default-features = false }

[dev-dependencies]
rmpv = "1.3"
serial_test = { version = "3.2", default-features = false, features = ["file_locks"] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
# Complete LTO before localizing the parser's native symbols.
lto = "fat"
codegen-units = 1
debug = 1

[[test]]
name = "isolation"
path = "tests/isolation.rs"
