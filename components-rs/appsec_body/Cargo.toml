[package]
name = "ddtrace-appsec-body"
version = "0.0.1"
edition = "2021"
rust-version = "1.91.1"
license = "Apache-2.0"
# tests/isolation_test.rs is compiled with rustc and must not be linked as an rlib.
autotests = false

[lib]
path = "lib.rs"
crate-type = ["staticlib"]

[dependencies]
serde = "=1.0.228"
serde_json = "=1.0.150"
quick-xml = { version = "=0.37.5", default-features = false }

[dev-dependencies]
rmpv = "1.3"
serial_test = { version = "3.2", default-features = false, features = ["file_locks"] }

[[test]]
name = "isolation"
path = "tests/isolation.rs"
