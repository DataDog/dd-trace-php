# SSI's PHP-independent output is a separate Cargo package so selecting it
# alongside datadog-php/profiling-embedded cannot enable runtime code in the
# PHP-ABI archive. Both packages reuse the implementation sources.
[package]
name = "datadog-php-common"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
build = "../build.rs"

[lib]
# Match the PHP-ABI target, including rlib: Cargo changes dependency LTO
# planning when a graph gains an rlib root, even with identical RUSTFLAGS.
crate-type = ["staticlib", "cdylib", "rlib"]
path = "../lib.rs"
bench = false

[lints.rust]
# Shared sources gate PHP code on this feature, which this package cannot enable.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(php_shared_build)', 'cfg(feature, values("profiling"))'] }

[features]
default = ["tracer-runtime", "profiling-runtime", "profiling-dependencies"]
# Keep these capabilities aligned with the root package. Most dependencies are
# inherited from [workspace.dependencies]; the rest share names with the
# libdatadog mirror there and still need matching declarations in both
# manifests. profiling-dependencies fixes feature resolution across all PHP ABIs;
# this package deliberately has no profiling (PHP capture/codegen) feature.
runtime = [
  "dep:arc-swap", "dep:tracing-core", "dep:libdd-common-ffi",
  "dep:libdd-library-config-ffi",
]
sidecar = [
  "runtime", "dep:datadog-sidecar", "dep:datadog-sidecar-ffi",
  "dep:spawn_worker", "dep:libdd-ipc", "dep:libdd-crashtracker",
  "dep:libdd-crashtracker-ffi",
  # sidecar.rs uses libdd-telemetry-ffi::try_c even without tracer-runtime.
  "dep:libdd-telemetry-ffi",
]
tracer-runtime = [
  "sidecar", "otel-context", "appsec", "dep:ddtrace-sidecar",
  "dep:libdd-telemetry", "dep:zwohash", "dep:hashbrown",
  "dep:bincode", "dep:const-str", "dep:libdd-trace-utils", "dep:libdd-trace-model",
  "dep:libdd-trace-stats", "dep:libdd-tinybytes", "dep:libdd-remote-config",
  "dep:libdd-live-debugger", "dep:libdd-live-debugger-ffi",
  "dep:libdd-data-pipeline", "dep:datadog-ffe", "dep:itertools",
  "dep:regex", "dep:regex-automata", "dep:serde", "dep:base64",
]
otel-context = ["dep:libdd-library-config", "dep:libdd-trace-protobuf"]
# build.rs compiles them as the separate components-rs/appsec_body crate.
appsec = ["dep:libdd-common-ffi", "dep:cc"]
# Match the dependency features unified by a paired profiler archive build, even
# when building common alone (e.g. PHP 7.0). SSI ships one byte-identical common
# DSO per architecture/libc family; changing features could change its code and
# the private Rust ABI. See the root manifest for the full rationale.
profiling-dependencies = [
  "dep:bindgen", "dep:cc",
  "dep:cpu-time", "dep:crossbeam-channel", "dep:dashmap", "dep:dynasmrt",
  "dep:libdd-alloc", "dep:libdd-profiling", "dep:libdd-process-utils",
  "dep:mach2", "dep:rand", "dep:rand_distr",
  "dep:rustc-hash", "dep:thiserror", "dep:chrono", "dep:env_logger",
]
profiling-runtime = ["dep:libdd-profiling"]

[dependencies]
libdd-common = { workspace = true }
libdd-networking = { workspace = true }
libdd-common-ffi = { workspace = true, optional = true }
libdd-telemetry = { workspace = true, optional = true }
libdd-telemetry-ffi = { workspace = true, optional = true }
libdd-live-debugger = { workspace = true, optional = true }
libdd-live-debugger-ffi = { workspace = true, optional = true }
libdd-ipc = { workspace = true, optional = true }
libdd-process-utils = { workspace = true, optional = true }
base64 = { workspace = true, features = ["alloc"], optional = true }
datadog-ffe = { workspace = true, optional = true }
libdd-remote-config = { workspace = true, optional = true }
datadog-sidecar = { workspace = true, optional = true }
datadog-sidecar-ffi = { workspace = true, optional = true }
libdd-data-pipeline = { workspace = true, optional = true }
libdd-tinybytes = { workspace = true, optional = true }
libdd-trace-utils = { workspace = true, optional = true }
libdd-trace-model = { workspace = true, optional = true }
libdd-trace-stats = { workspace = true, optional = true }
libdd-trace-protobuf = { workspace = true, optional = true }
libdd-crashtracker = { workspace = true, optional = true }
libdd-crashtracker-ffi = { workspace = true, optional = true }
libdd-library-config-ffi = { workspace = true, optional = true }
spawn_worker = { workspace = true, optional = true }
anyhow = "1.0"
arc-swap = { workspace = true, optional = true }
const-str = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
serde = { version = "1.0.196", optional = true }
lazy_static = { workspace = true }
log = { version = "0.4.20", features = ["max_level_trace", "release_max_level_trace"] }
env_logger = { version = "0.11", optional = true }
zwohash = { version = "0.1.2", optional = true }
uuid = { version = "1.0", features = ["v4"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-core = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "smallvec"] }
serde_json = "1.0.113"
regex = { version = "1.10.5", optional = true }
regex-automata = { workspace = true, optional = true }
http = "1.4"
libc = "0.2"
bincode = { version = "1.3.3", optional = true }
hashbrown = { workspace = true, optional = true }
chrono = { version = "0.4", optional = true }
cpu-time = { workspace = true, optional = true }
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"], optional = true }
dashmap = { workspace = true, optional = true }
dynasmrt = { workspace = true, optional = true }
libdd-alloc = { workspace = true, optional = true }
libdd-profiling = { workspace = true, optional = true }
rand = { version = "0.9.4", optional = true }
rand_distr = { workspace = true, optional = true }
rustc-hash = { version = "2.1.3", optional = true }
thiserror = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libdd-library-config = { workspace = true, optional = true }

# ddtrace-sidecar only adds the AppSec backend registration around libdatadog's daemon entrypoint,
# which is a Unix-only concern. On Windows `run_sidecar` uses `datadog_sidecar` directly instead.
[target.'cfg(unix)'.dependencies]
ddtrace-sidecar = { workspace = true, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = { workspace = true, optional = true }

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = { version = "1.0", optional = true }
