name: Profiling correctness

on:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  prof-correctness:
    runs-on: ubuntu-24.04
    env:
      # LLVM's own release build from GitHub, pinned by its published SHA256.
      LLVM_RELEASE: "20.1.8"
      LLVM_SHA256: "1ead36b3dfcb774b57be530df42bec70ab2d239fbce9889447c7a29a4ddc1ae6"
      # Keep profiler correctness isolated when the tests use a combined build.
      DD_PROFILING_ENABLED: "true"
      DD_TRACE_ENABLED: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
      PROFILE_EXTENSION: ${{ matrix.php-version == '8.5' && 'ddtrace.so' || 'datadog-profiling.so' }}
      PROFILE_SO: ${{ github.workspace }}/tmp/build_${{ matrix.php-version == '8.5' && 'combined' || 'profiler' }}/modules/${{ matrix.php-version == '8.5' && 'ddtrace.so' || 'datadog-profiling.so' }}
      PROFILE_RI: ${{ matrix.php-version == '8.5' && 'ddtrace' || 'datadog-profiling' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        phpts: [nts, zts]
        include:
          - phpts: zts
            extensions: parallel-krakjoe/parallel@v1.2.7

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: ${{ matrix.extensions }}
        env:
          phpts: ${{ matrix.phpts }}
          fail-fast: true

      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tmp/build_profiler/target-profiling/
            tmp/build_combined/target-common/
          key: ${{ runner.os }}-cargo-llvm-${{ env.LLVM_RELEASE }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ matrix.php-version }}-${{ matrix.phpts }}

      # All matrix jobs share one LLVM, so it is cached separately from the
      # per-job build cache.
      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/llvm
          key: ${{ runner.os }}-llvm-${{ env.LLVM_RELEASE }}-${{ env.LLVM_SHA256 }}

      - name: Download LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          # Only the parts the build uses: the full toolchain unpacks to over 9 GB.
          llvm_archive="LLVM-${LLVM_RELEASE}-Linux-X64.tar.xz"
          llvm_top="${llvm_archive%.tar.xz}"
          curl -fsSL --retry 3 -o "/tmp/${llvm_archive}" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_RELEASE}/${llvm_archive}"
          echo "${LLVM_SHA256}  /tmp/${llvm_archive}" | sha256sum -c -
          mkdir -p ~/llvm
          tar -xJf "/tmp/${llvm_archive}" -C ~/llvm --strip-components=1 --wildcards \
            "${llvm_top}/bin/clang" "${llvm_top}/bin/clang++" "${llvm_top}/bin/clang-[0-9]*" \
            "${llvm_top}/bin/ld.lld" "${llvm_top}/bin/lld" "${llvm_top}/bin/llvm-config" \
            "${llvm_top}/lib/libclang.so*" "${llvm_top}/lib/clang/*"
          rm -f "/tmp/${llvm_archive}"

      - name: Cache LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/llvm
          key: ${{ runner.os }}-llvm-${{ env.LLVM_RELEASE }}-${{ env.LLVM_SHA256 }}

      - name: Build profiler
        run: |
          llvm_root="${HOME}/llvm"
          # lld needs libxml2; config.m4 also requires the libcurl development
          # library (curl_easy_setopt), which is absent on some runner images.
          if ! dpkg -s libxml2 libcurl4-openssl-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2 libcurl4-openssl-dev
          fi
          export PATH="${llvm_root}/bin:${PATH}"
          export CC=clang
          export CXX=clang++
          export LLVM_CONFIG_PATH="${llvm_root}/bin/llvm-config"
          export LIBCLANG_PATH="${llvm_root}/lib"
          export LD_LIBRARY_PATH="${LIBCLANG_PATH}:${LD_LIBRARY_PATH:-}"
          clang --version
          ld.lld --version
          "$LLVM_CONFIG_PATH" --version
          version_number=$(awk -F' = ' '$1 == "channel" { gsub(/"/, "", $2); print $2 }' rust-toolchain.toml)
          curl https://sh.rustup.rs -sSf | sh -s -- --profile minimal -y --default-toolchain "$version_number"
          if [ "${{ matrix.php-version }}" = "8.5" ]; then
            make compile_combined -j"$(nproc)"
          else
            make compile_profiler PROFILER_FEATURES=trigger_time_sample -j"$(nproc)"
          fi

      - name: Cache build dependencies
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tmp/build_profiler/target-profiling/
            tmp/build_combined/target-common/
          key: ${{ runner.os }}-cargo-llvm-${{ env.LLVM_RELEASE }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ matrix.php-version }}-${{ matrix.phpts }}

      - name: Run no profile test
        run: |
          export DD_PROFILING_ENABLED=Off
          export DD_PROFILING_EXPERIMENTAL_FEATURES_ENABLED=1
          export DD_PROFILING_EXCEPTION_MESSAGE_ENABLED=1
          php -v
          php -d extension="${PROFILE_SO}" --ri "${PROFILE_RI}"
          for test_case in "allocation_sampling_distance" "allocations" "allocation_upscaling_mixed_sizes" "time" "strange_frames" "timeline" "exceptions" "io" "socket_io" "io_upscaling" "allocation_time_combined" "generators"; do
              mkdir -p profiling/tests/correctness/"$test_case"/
              export DD_PROFILING_OUTPUT_PPROF=$PWD/profiling/tests/correctness/"$test_case"/test.pprof
              php -d extension="${PROFILE_SO}" "profiling/tests/correctness/${test_case}.php"
              if compgen -G "$DD_PROFILING_OUTPUT_PPROF.*" > /dev/null; then
                echo "Profile output should not exist:"
                ls -l "$DD_PROFILING_OUTPUT_PPROF".*
                exit 1;
              fi
          done

      - name: Run tests
        run: |
          export DD_PROFILING_LOG_LEVEL=trace
          export DD_PROFILING_EXPERIMENTAL_FEATURES_ENABLED=1
          export DD_PROFILING_EXPERIMENTAL_EXCEPTION_SAMPLING_DISTANCE=1
          export DD_PROFILING_EXCEPTION_MESSAGE_ENABLED=1
          php -v
          php -d extension="${PROFILE_SO}" --ri "${PROFILE_RI}"
          for test_case in "allocations" "allocation_upscaling_mixed_sizes" "time" "strange_frames" "timeline" "exceptions" "io" "socket_io" "io_upscaling" "allocation_time_combined" "generators"; do
              mkdir -p profiling/tests/correctness/"$test_case"/
              export DD_PROFILING_OUTPUT_PPROF=$PWD/profiling/tests/correctness/"$test_case"/test.pprof
              php -d extension="${PROFILE_SO}" profiling/tests/correctness/"$test_case".php
          done
          mkdir -p profiling/tests/correctness/allocation_sampling_distance/
          export DD_PROFILING_OUTPUT_PPROF=$PWD/profiling/tests/correctness/allocation_sampling_distance/test.pprof
          php -d extension="${PROFILE_SO}" -d datadog.profiling.allocation_sampling_distance=1 profiling/tests/correctness/allocation_sampling_distance.php
          mkdir -p profiling/tests/correctness/allocations_1byte/
          export DD_PROFILING_OUTPUT_PPROF=$PWD/profiling/tests/correctness/allocations_1byte/test.pprof
          export DD_PROFILING_ALLOCATION_SAMPLING_DISTANCE=1
          php -d extension="${PROFILE_SO}" profiling/tests/correctness/allocations.php
          mkdir -p profiling/tests/correctness/allocations_1byte_no_zend_alloc/
          export DD_PROFILING_OUTPUT_PPROF=$PWD/profiling/tests/correctness/allocations_1byte_no_zend_alloc/test.pprof
          export DD_PROFILING_ALLOCATION_SAMPLING_DISTANCE=1
          USE_ZEND_ALLOC=0 php -d extension="${PROFILE_SO}" profiling/tests/correctness/allocations.php
          unset DD_PROFILING_ALLOCATION_SAMPLING_DISTANCE

      - name: Run standalone profiler with the OpenTelemetry SDK tracer
        if: matrix.php-version == '8.4' && matrix.phpts == 'nts'
        run: |
          mkdir -p /tmp/otel-sdk
          composer require --working-dir=/tmp/otel-sdk --no-interaction --no-progress open-telemetry/sdk:^1.0
          cat >/tmp/otel-sdk/coexistence.php <<'PHP'
          <?php
          require __DIR__ . '/vendor/autoload.php';

          $provider = new OpenTelemetry\SDK\Trace\TracerProvider();
          $tracer = $provider->getTracer('datadog-profiler-coexistence');
          $span = $tracer->spanBuilder('coexistence')->startSpan();
          $scope = $span->activate();

          if (!extension_loaded('datadog-profiling') || extension_loaded('ddtrace')) {
              throw new RuntimeException('expected only the standalone profiler extension');
          }
          if (!filter_var(ini_get('datadog.profiling.enabled'), FILTER_VALIDATE_BOOL)) {
              throw new RuntimeException('profiling is not enabled');
          }

          $scope->detach();
          $span->end();
          $provider->shutdown();
          echo "standalone profiler and OpenTelemetry SDK tracer coexist\n";
          PHP
          php -d "extension=${PWD}/tmp/build_profiler/modules/datadog-profiling.so" /tmp/otel-sdk/coexistence.php

      - name: Run combined tracer and profiler integration tests
        if: matrix.php-version == '8.5' && matrix.phpts == 'nts'
        env:
          DD_TRACE_ENABLED: "true"
        run: |
          export TEST_PHP_EXECUTABLE="$(command -v php)"
          php run-tests.php -q \
            -d "extension=${PROFILE_SO}" \
            tests/ext/extension_disabled.phpt \
            tests/ext/profiling/runtime_id_01.phpt \
            tests/ext/profiling/runtime_id_02.phpt

          endpoint_output=$(
            DD_TRACE_CLI_ENABLED=true \
            DD_PROFILING_ENABLED=true \
            DD_PROFILING_LOG_LEVEL=trace \
            DD_PROFILING_OUTPUT_PPROF=/tmp/combined-endpoint.pprof \
            php -d "extension=${PROFILE_SO}" \
              -r '$span = DDTrace\active_span(); $span->type = "web"; $span->resource = "combined-endpoint-test";' \
              2>&1
          )
          echo "${endpoint_output}"
          grep -q 'Enqueued endpoint profiling information for span id:' <<<"${endpoint_output}"

      - name: Run ZTS tests
        if: matrix.phpts == 'zts'
        run: |
          export DD_PROFILING_LOG_LEVEL=trace
          export DD_PROFILING_EXPERIMENTAL_FEATURES_ENABLED=1
          export DD_PROFILING_EXPERIMENTAL_EXCEPTION_SAMPLING_DISTANCE=1
          export DD_PROFILING_EXCEPTION_MESSAGE_ENABLED=1
          php -v
          php -d extension="${PROFILE_SO}" --ri "${PROFILE_RI}"
          for test_case in "exceptions_zts"; do
              mkdir -p profiling/tests/correctness/"$test_case"/
              export DD_PROFILING_OUTPUT_PPROF=$PWD/profiling/tests/correctness/"$test_case"/test.pprof
              php -d extension="${PROFILE_SO}" profiling/tests/correctness/"$test_case".php
          done

      - name: Check allocation sampling distance configuration
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/allocation_sampling_distance.json
          pprof_path: profiling/tests/correctness/allocation_sampling_distance/

      - name: Check profiler correctness for allocations
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/allocations.json
          pprof_path: profiling/tests/correctness/allocations/

      - name: Check profiler correctness for allocations with 1 byte sampling distance
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/allocations.json
          pprof_path: profiling/tests/correctness/allocations_1byte/

      - name: Check profiler correctness for allocations with 1 byte sampling distance and `USE_ZEND_ALLOC=0`
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/allocations.json
          pprof_path: profiling/tests/correctness/allocations_1byte_no_zend_alloc/

      - name: Check profiler correctness for time
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/time.json
          pprof_path: profiling/tests/correctness/time/

      - name: Check profiler correctness for strange frames
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/strange_frames.json
          pprof_path: profiling/tests/correctness/strange_frames/

      - name: Check profiler correctness for timeline
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/timeline.json
          pprof_path: profiling/tests/correctness/timeline/

      - name: Check profiler correctness for allocation_time_combined
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/allocation_time_combined.json
          pprof_path: profiling/tests/correctness/allocation_time_combined/

      - name: Check profiler correctness for generators
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/generators.json
          pprof_path: profiling/tests/correctness/generators/

      - name: Check profiler correctness for IO
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/io.json
          pprof_path: profiling/tests/correctness/io/

      - name: Check profiler correctness for socket IO
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/socket_io.json
          pprof_path: profiling/tests/correctness/socket_io/

      - name: Check profiler correctness for IO upscaling
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/io_upscaling.json
          pprof_path: profiling/tests/correctness/io_upscaling/

      - name: Check profiler correctness for exceptions ZTS
        if: matrix.phpts == 'zts'
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/exceptions_zts.json
          pprof_path: profiling/tests/correctness/exceptions_zts/

      - name: Check profiler correctness for exceptions
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/exceptions.json
          pprof_path: profiling/tests/correctness/exceptions/

      - name: Check profiler correctness for mixed allocation sizes
        uses: Datadog/prof-correctness/analyze@main
        with:
          expected_json: profiling/tests/correctness/allocation_upscaling_mixed_sizes.json
          pprof_path: profiling/tests/correctness/allocation_upscaling_mixed_sizes/

      - name: Run standalone and ddtrace conflict tests
        if: matrix.php-version == '8.5' && matrix.phpts == 'nts'
        run: |
          cp "${PROFILE_SO}" /tmp/ddtrace-combined.so
          llvm_root="${HOME}/llvm"
          export PATH="${llvm_root}/bin:${PATH}"
          export CC=clang
          export CXX=clang++
          export LLVM_CONFIG_PATH="${llvm_root}/bin/llvm-config"
          export LIBCLANG_PATH="${llvm_root}/lib"
          export LD_LIBRARY_PATH="${LIBCLANG_PATH}:${LD_LIBRARY_PATH:-}"
          make compile_profiler -j"$(nproc)"
          export TEST_PHP_EXECUTABLE="$(command -v php)"
          export DDTRACE_TEST_TRACER_EXTENSION=/tmp/ddtrace-combined.so
          export DDTRACE_TEST_PROFILER_EXTENSION="${PWD}/tmp/build_profiler/modules/datadog-profiling.so"
          php run-tests.php -q \
            profiling/tests/phpt/standalone_conflict_ddtrace_first.phpt \
            profiling/tests/phpt/standalone_conflict_profiler_first.phpt

      - name: Notify Slack
        if: failure() && github.ref == 'refs/heads/master'
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{'scenarios': 'PHP', 'failed_run_url': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'}"
